services:
  pyrosync:
    build: .
    image: spatial-sequencers-pyrosync:latest
    container_name: pyrosync-observatory
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MIDWEST_SERVICE=http://midwest-data:3001
    depends_on:
      - midwest-data
    restart: unless-stopped

  midwest-data:
    build:
      context: .
      dockerfile: Dockerfile.midwest
    image: spatial-sequencers-midwest-data:latest
    environment:
      - FIRMS_MAP_KEY
    volumes:
      - midwest-cache:/cache
    restart: unless-stopped

volumes:
  midwest-cache:
