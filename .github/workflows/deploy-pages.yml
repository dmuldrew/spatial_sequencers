# Build and deploy PyroSync static bundle (public/ + vendor/ + .nojekyll) to GitHub Pages
name: Deploy PyroSync to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, tag, or commit SHA to build and deploy"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static bundle (public + vendor + .nojekyll)
        run: |
          chmod +x scripts/deploy-gh-pages.sh
          ./scripts/deploy-gh-pages.sh --build-only
          echo "Deployed source ref: ${{ inputs.branch || github.ref }} ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
