# Build and deploy PyroSync static bundle (pyrosync/public/ + vendor/ + .nojekyll) to GitHub Pages
name: Deploy PyroSync to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static bundle (public + vendor + .nojekyll)
        run: ./pyrosync/scripts/deploy-gh-pages.sh --build-only

      - name: Assemble site (landing page + both projects)
        run: |
          rm -rf ./site-dist
          mkdir -p ./site-dist/pyrosync ./site-dist/space-jukebox
          cp ./site/index.html ./site-dist/index.html
          cp -R ./pyrosync/dist/. ./site-dist/pyrosync/
          cp ./space-jukebox/index.html ./site-dist/space-jukebox/index.html
          cp ./space-jukebox/fly.html ./site-dist/space-jukebox/fly.html
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
