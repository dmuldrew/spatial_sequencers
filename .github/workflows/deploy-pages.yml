name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch, tag, or SHA to build and deploy"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static PyroSync bundle
        run: |
          chmod +x ./pyrosync/scripts/deploy-gh-pages.sh
          ./pyrosync/scripts/deploy-gh-pages.sh --build-only

      - name: Assemble GitHub Pages site
        run: |
          rm -rf ./site-dist
          mkdir -p ./site-dist/pyrosync ./site-dist/space-jukebox
          cp ./site/index.html ./site-dist/index.html
          touch ./site-dist/.nojekyll
          cp -R ./pyrosync/dist/. ./site-dist/pyrosync/
          cp -R ./space-jukebox/. ./site-dist/space-jukebox/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
